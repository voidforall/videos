<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>C++ functional programming walkthrough</title>
    <link rel="stylesheet" href="styles/base.css" />
    <style>
      body { background: #0f0f0e; font-family: system-ui, sans-serif; }
      #frame { margin: 0 auto; overflow: hidden; }
      #stage { transform-origin: 0 0; }
      #controls { display: flex; gap: 14px; align-items: center; height: 64px; padding: 0 20px; color: #faf9f5; }
      #controls input { flex: 1; }
      #controls button { width: 84px; padding: 8px; }
      #controls output { font: 14px ui-monospace, monospace; min-width: 170px; text-align: right; }
      body.render { background: #faf9f5; }
      body.render #controls { display: none; }
    </style>
  </head>
  <body>
    <div id="frame">
      <div id="stage">
        <div id="captions"></div>
      </div>
    </div>
    <div id="controls"><button type="button">Play</button><input type="range" min="0" step="0.01" value="0" /><output></output></div>

    <script src="node_modules/gsap/dist/gsap.min.js"></script>
    <script src="timing.js"></script>
    <script src="runtime.js"></script>
    <script src="scenes/01-functions-as-values.js"></script>
    <script src="scenes/02-map-filter-reduce.js"></script>
    <script src="scenes/03-with-lock.js"></script>
    <script src="scenes/04-type-erasure.js"></script>
    <script src="scenes/05-captures.js"></script>
    <script src="scenes/06-mutable.js"></script>
    <script src="scenes/07-recursive.js"></script>
    <script src="scenes/08-generic-recap.js"></script>
  </body>
</html>
