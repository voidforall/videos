<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#faf9f5" />
    <meta name="description" content="Short animated revision episodes for technical interview notes: one clip per question, with a pause to answer before the explanation." />
    <title>Revision episodes</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #141413;
        --cream: #faf9f5;
        --tile: #efe9de;
        --coral: #cb785c;
        --navy: #181715;
        --hair: rgba(20,20,19,.14);
        --muted: rgba(20,20,19,.64);
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        --serif: Georgia, "Times New Roman", serif;
      }

      * { box-sizing: border-box; }
      html { background: var(--cream); }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background:
          linear-gradient(rgba(20,20,19,.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(20,20,19,.035) 1px, transparent 1px),
          var(--cream);
        background-size: 64px 64px;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: clamp(32px, 7vw, 88px) 0 56px; }

      .eyebrow { display: flex; align-items: center; gap: 12px; margin: 0 0 18px; font: 600 12px/1.2 var(--mono); letter-spacing: .16em; text-transform: uppercase; }
      .eyebrow::before { content: "✱"; color: var(--coral); font-size: 18px; }

      h1 { max-width: 880px; margin: 0; font-family: var(--serif); font-size: clamp(44px, 7.2vw, 94px); font-weight: 400; line-height: .98; letter-spacing: -.04em; }
      h2 { margin: 0; font-family: var(--serif); font-size: clamp(32px, 4.6vw, 58px); font-weight: 400; line-height: 1.02; letter-spacing: -.03em; }
      .lede { max-width: 720px; margin: 24px 0 36px; color: var(--muted); font-size: clamp(17px, 2.2vw, 22px); line-height: 1.55; }
      .summary { max-width: 760px; margin: 14px 0 24px; color: var(--muted); font-size: 17px; line-height: 1.55; }

      .episode + .episode { margin-top: clamp(56px, 9vw, 104px); }
      .episode-head { display: flex; justify-content: space-between; align-items: end; gap: 24px; }
      .progress { flex: none; font: 600 12px/1.2 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

      .layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
      .layout.multi { grid-template-columns: minmax(0, 2.1fr) minmax(0, 1fr); align-items: start; }

      .player { overflow: hidden; border: 1px solid rgba(20,20,19,.16); border-radius: 14px; background: var(--navy); box-shadow: 0 1px 3px rgba(20,20,19,.08), 0 16px 48px rgba(20,20,19,.10); }
      video { display: block; width: 100%; aspect-ratio: 16 / 9; background: var(--navy); }
      .now { padding: 16px 20px 18px; color: var(--cream); border-top: 1px solid rgba(250,249,245,.16); }
      .now small { display: block; margin-bottom: 6px; color: rgba(250,249,245,.55); font: 600 10px/1.2 var(--mono); letter-spacing: .13em; text-transform: uppercase; }
      .now span { font-size: 15px; line-height: 1.45; }

      .clips { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
      .clip { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 14px; align-items: start; padding: 14px 16px; border: 1px solid var(--hair); border-radius: 12px; background: var(--cream); cursor: pointer; text-align: left; font: inherit; color: inherit; width: 100%; }
      .clip:hover { border-color: rgba(20,20,19,.32); }
      .clip[aria-current="true"] { background: var(--tile); border-color: rgba(20,20,19,.32); }
      .clip-num { width: 38px; font: 600 13px/1.5 var(--mono); color: var(--muted); white-space: nowrap; }
      .clip-title { font-weight: 600; font-size: 15px; line-height: 1.4; }
      .clip-q { grid-column: 2 / 4; color: var(--muted); font-size: 14px; line-height: 1.45; }
      .clip-meta { font: 12px/1.5 var(--mono); color: var(--muted); white-space: nowrap; }
      .clip.done .clip-num::after { content: " ✓"; color: #3f8f52; }

      .source { margin-top: 14px; color: var(--muted); font-size: 14px; }
      .reviewed { display: inline-flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 14px; color: var(--muted); cursor: pointer; }

      footer { display: flex; justify-content: space-between; gap: 24px; margin-top: 64px; color: var(--muted); font-size: 14px; }
      a { color: inherit; text-underline-offset: 3px; }
      a:hover { color: var(--coral); }
      .error { padding: 16px; border: 1px solid var(--coral); border-radius: 12px; }

      @media (max-width: 860px) {
        .layout.multi { grid-template-columns: minmax(0, 1fr); }
      }
      @media (max-width: 680px) {
        main { width: min(100% - 32px, 1180px); padding-top: 28px; }
        .player { border-radius: 9px; }
        .episode-head { flex-direction: column; align-items: start; gap: 8px; }
        footer { flex-direction: column; gap: 8px; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Technical field notes</p>
      <h1>Revision episodes</h1>
      <p class="lede">One short clip per question. Each opens with the question and a pause—answer out loud first, then watch the explanation.</p>
      <div id="episodes"></div>
      <footer>
        <span>Generated from <a href="https://github.com/voidforall/ai-docs">ai-docs</a> with local text-to-speech and code-driven animation.</span>
        <a href="https://github.com/voidforall/videos">View source on GitHub</a>
      </footer>
    </main>

    <script>
      (() => {
        const STORE = "reviewed-clips";
        const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
        const mmss = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
        const loadReviewed = () => { try { return new Set(JSON.parse(localStorage.getItem(STORE) || "[]")); } catch { return new Set(); } };
        const saveReviewed = (set) => { try { localStorage.setItem(STORE, JSON.stringify([...set])); } catch { /* storage unavailable */ } };
        let reviewed = loadReviewed();

        function renderEpisode(ep) {
          const multi = ep.clips.length > 1;
          const section = document.createElement("section");
          section.className = "episode";
          section.id = ep.slug;
          section.innerHTML = `
            <div class="episode-head">
              <div><p class="eyebrow">${esc(ep.kicker)}</p><h2>${esc(ep.title)}</h2></div>
              ${multi ? `<p class="progress"></p>` : ""}
            </div>
            <p class="summary">${esc(ep.summary)}</p>
            <div class="layout ${multi ? "multi" : ""}">
              <div>
                <div class="player">
                  <video controls playsinline preload="metadata"></video>
                  <div class="now"><small></small><span></span></div>
                </div>
                <label class="reviewed"><input type="checkbox" /> Mark this clip reviewed</label>
              </div>
              ${multi ? `<ol class="clips">${ep.clips.map((c) => `
                <li><button class="clip" data-id="${esc(c.id)}">
                  <span class="clip-num">${esc(c.id)}</span><span class="clip-title">${esc(c.title)}</span><span class="clip-meta">${mmss(c.duration)}</span>
                  <span class="clip-q">${esc(c.question)}</span>
                </button></li>`).join("")}</ol>` : ""}
            </div>
            <p class="source">Source notes: <a href="${esc(ep.source)}">${esc(ep.source.replace("https://github.com/", ""))}</a></p>`;

          const video = section.querySelector("video");
          const now = section.querySelector(".now");
          const box = section.querySelector(".reviewed input");
          const key = (c) => `${ep.slug}/${c.id}`;
          let current = ep.clips[0];

          const refresh = () => {
            section.querySelectorAll(".clip").forEach((b) => {
              b.setAttribute("aria-current", String(b.dataset.id === current.id));
              b.classList.toggle("done", reviewed.has(`${ep.slug}/${b.dataset.id}`));
            });
            const done = ep.clips.filter((c) => reviewed.has(key(c))).length;
            const progress = section.querySelector(".progress");
            if (progress) progress.textContent = `${done} / ${ep.clips.length} reviewed`;
            box.checked = reviewed.has(key(current));
          };
          const select = (clip, { autoplay = false, updateHash = true } = {}) => {
            current = clip;
            video.poster = clip.poster;
            video.src = clip.video;
            now.querySelector("small").textContent = multi ? `Clip ${clip.id} · ${mmss(clip.duration)}` : `Duration · ${mmss(clip.duration)}`;
            now.querySelector("span").textContent = clip.question;
            if (updateHash) history.replaceState(null, "", `#${ep.slug}/${clip.id}`);
            if (autoplay) video.play().catch(() => {});
            refresh();
          };
          const mark = (on) => {
            reviewed = new Set(reviewed);
            on ? reviewed.add(key(current)) : reviewed.delete(key(current));
            saveReviewed(reviewed);
            refresh();
          };

          section.querySelectorAll(".clip").forEach((b) =>
            b.addEventListener("click", () => select(ep.clips.find((c) => c.id === b.dataset.id), { autoplay: true })));
          box.addEventListener("change", () => mark(box.checked));
          video.addEventListener("ended", () => mark(true));
          select(current, { updateHash: false });
          return { section, select, ep };
        }

        async function main() {
          const root = document.getElementById("episodes");
          try {
            const res = await fetch("catalog.json", { cache: "no-cache" });
            if (!res.ok) throw new Error(`catalog.json: HTTP ${res.status}`);
            const { episodes } = await res.json();
            const views = episodes.map(renderEpisode);
            views.forEach((v) => root.appendChild(v.section));
            const [slug, clipId] = decodeURIComponent(location.hash.slice(1)).split("/");
            const target = views.find((v) => v.ep.slug === slug);
            if (target) {
              const clip = target.ep.clips.find((c) => c.id === clipId);
              if (clip) target.select(clip);
              target.section.scrollIntoView();
            }
          } catch (e) {
            root.innerHTML = `<p class="error">Could not load the episode catalog. ${esc(e.message)}</p>`;
          }
        }
        main();
      })();
    </script>
  </body>
</html>
